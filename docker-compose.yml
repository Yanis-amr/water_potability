services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water-potability-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: water-potability-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
